name: Latest blog posts

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: gautamkrishnar/blog-post-workflow@1.9.7
        with:
          feed_list: "https://blog.jimididit.com/rss.xml"
          max_post_count: 3
          template: "- [**$title**]($url) - *$date*"
          date_format: "mmm d, yyyy"
          commit_message: "chore: update blog posts [skip ci]"
          committer_username: jimididit
          committer_email: jimididit@users.noreply.github.com
